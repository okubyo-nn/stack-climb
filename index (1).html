html,body{height:100%}

.hud{text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 8px rgba(0,0,0,.45)}   /* stays readable on the light sky */
.ban{color:var(--banana)}
.bvw{position:relative;display:inline-flex}

/* badge sits in the flow under the block (overlapping its bottom), so the column widens for big numbers instead of spilling out */
.evo-bw .bvb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:2px;left:auto;right:auto;bottom:auto;margin-top:-.8em;white-space:nowrap;height:1.7em;line-height:1;padding:0 .45em 0 .3em;font-size:13px}

.evb2 i{position:absolute;left:0;top:0;bottom:0;background:#8b979c;border-radius:13px}.evb2.ok i{background:linear-gradient(#ffd766,#f3ae3c)}
.evb2 span{position:relative;display:flex;align-items:center;justify-content:center;height:100%;padding:0 8px;white-space:nowrap;font:400 var(--fs,14px)/1 "Dela Gothic One","Zen Kaku Gothic New",sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}

.bvb{position:absolute;right:-.55em;bottom:-.35em;display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;padding:0 .3em;height:1.5em;border-radius:.75em;background:#e8302a;border:2px solid #fff;color:#fff;
  font:400 calc(12px*var(--hk,1))/1 "Dela Gothic One","Zen Kaku Gothic New",sans-serif;text-align:center;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap}
.evb{width:96px;height:8px;border-radius:4px;background:rgba(10,30,31,.45);margin-top:6px;overflow:hidden}.evb i{display:block;height:100%;width:0;background:#9aa3a8;border-radius:3px}
.evb.ok i{background:#f5d547;box-shadow:0 0 8px #f5d547}.evb.ok{animation:evbg 1s ease-in-out infinite}@keyframes evbg{50%{box-shadow:0 0 10px rgba(245,213,71,.8)}}
.meter{width:96px;height:6px;border-radius:3px;background:rgba(10,30,31,.4);margin-top:6px;margin-left:auto;overflow:hidden}

.menu{position:fixed;inset:0;overflow-x:hidden;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(8,26,28,.74);touch-action:pan-y}

.top{display:flex;flex-direction:column;gap:14px}

.card.home,.card.over{height:100%;min-height:min-content;display:grid;align-content:stretch}   /* a set height: the spare rows share only the leftover space (with min-height alone they grew to match the tallest row and the screen could scroll) */
.card.home{grid-template-rows:auto 1fr auto auto 1.1fr;gap:26px}

.r-best{white-space:nowrap}
@media (max-height:760px){.g-row b{font-size:38px}.card.over .logo{max-width:250px}.card.over .result{padding:12px 20px;gap:14px}.r-h{font-size:calc(38px*var(--fit,1));margin:2px 0 4px}.r-gain{font-size:calc(34px*var(--fit,1))}.r-gain svg{width:calc(58px*var(--fit,1));height:calc(58px*var(--fit,1))}.r-best{font-size:13px}.card.over{gap:14px}.card.over .top{gap:10px}.card.over .sub{min-height:74px}.g-t b{font-size:38px}}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}

const tileOf0=v=>v===1?blk('wood'):v===5?blk('ice'):blk('stone');
/* ---------- BOOST growth (tiers) ----------
   24 tiers: the monkey grows, so each wood cell is drawn as 1x1, 2x2, 3x3 smaller wood blocks (stone and ice stay one block),
   then the colours: red 1x1, 2x2, 3x3, blue ..., purple 3x3. The physics never changes (the monkey and the cells grow together);
   only the numbers do: a cell climbed counts tierMult metres, and a banana is worth tierMult (bananas are bigger too).
   Multiplier = 4^colour x sub (1,2,3 | 4,8,12 | 16,32,48 | ... | 16384,32768,49152).
   Each tier: the four upgrades go up to TIER_CAP; to evolve, all four at the cap, a climb of EVO_H cells in this tier, and
   EVO_C x multiplier bananas; the upgrades start again from 0. */
const TIER_N=24,TIER_CAP=5,EVO_H=100,EVO_DH=25,EVO_C=300,TIER_COL=[null,'#e53935','#1e63d6','#f2c200','#2e9e44','#f57c00','#29b6d6','#8e44ad'];
// the climb needed to evolve grows by EVO_DH cells per tier (tier 0: 100 ... tier 22: 650)
function evoH(){return EVO_H+EVO_DH*(save.tier||0)}
const tierSub=t=>t%3+1,tierCol=t=>Math.floor(t/3),tierMult=t=>Math.pow(4,tierCol(t))*tierSub(t);
let runMult=1,runSub=1,runColI=0,runTier=0;   // this run's tier (BOOST only; set at the start of the run)
const fmtN=n=>{n=Math.round(n);return n<1e6?n.toLocaleString('en-US'):n<1e9?(n/1e6).toFixed(n<1e7?2:1).replace(/\.?0+$/,'')+'M':(n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B'};
const fmtH=h=>h<1e4?h.toFixed(1):fmtN(h);   // heights as shown: 0.1m steps while small, whole (and short) numbers once large
const dispH=h=>h*runMult;
const tierTiles={};
function tierTile(v){const base=tileOf0(v);if(runSub===1&&!runColI)return base;
  const key=v+'_'+runSub+'_'+runColI+'_'+S;let c=tierTiles[key];if(c)return c;
  const n=Math.max(64,Math.round(S*DPR)*runSub);c=document.createElement('canvas');   // drawn at the screen's own resolution (each small block as sharp as a normal one)
  c.width=c.height=n;const g=c.getContext('2d');

  if(v===1&&runSub>1){const q=n/runSub;for(let i=0;i<runSub;i++)for(let j=0;j<runSub;j++)g.drawImage(base,Math.round(i*q),Math.round(j*q),Math.ceil(q),Math.ceil(q))}

/* ---------- fingers ---------- */
// Each finger is tied to one hand from the moment it touches until it lifts, wherever it moves on the screen.
const fingers=new Map();
// one-hand mode: the last tap's position keeps steering after the finger lifts (direction and arm length), until the next tap
let spinDir=0,flipFrom=-1,flipUntil=-1;const FLIPBAND=.3,flipMode=()=>save.opt.mode==='one';   // one-finger: each catching tap always reverses the turn
let cmd=null,frozen=false,lastTapAt=-1e9,lastTapId=null,pairFrom=-1,pairUntil=-1,lastGrabAt=-1e9;const PAIR=.09;
function claimedBy(i){for(const f of fingers.values())if(f.hand===i)return f;return null}
function touchStart(id,x,y){
  if(!running)return;
  const one=save.opt.mode==='one';
  if(one)for(const [k,g] of fingers)if(g.up)fingers.delete(k);
  if(fingers.size>=2)return;
  const f={hand:-1,ox:x,oy:y,x,y,switchT:0,grabT:BUF,key:id==='kz'||id==='kx'};fingers.set(id,f);
  // the first tap of a climb (and after a revive or a restart from the ground) only starts the turn: it never catches,
  // even if the free hand happens to be over a block already
  const first=firstTap&&nHeld()>0;firstTap=false;
  /* JUST: a tap made while the green ring is small (from JW_EARLY before it closes to JW_LATE after) is a JUST: the free hand
     catches the edge the ring marks, as an edge grip (if the tap was a little early, it catches when the hand gets there).
     Any other tap is an ordinary catch. */
  f.just=[null,null];
  if(justTgt&&nHeld()===1&&piv>=0){const d=T-justTgt.at;if(d>=-JW_EARLY&&d<=JW_LATE){const fi=1-piv;f.just[fi]={x:justTgt.x,y:justTgt.y};f.justAt=justTgt.at;f.grabT=Math.max(BUF,justTgt.at-T+.06)}}
  if(first){f.grabT=0;f.just=[null,null]}
  if(one){
    // one-hand: a tap sets the turn direction (and arm length), and catches with the free hand if it can grab right now.
    // If it can't, the current hand keeps holding and only the direction changes.
    // two fingers tapping together (within PAIR seconds of game time): if that tap catches with the free hand,
    // the monkey stops dead there and stays still until the next single tap. If nothing is caught it's just a normal tap.
    const now=T,prev=lastTapAt,pair=now-prev<PAIR&&id!==lastTapId;lastTapAt=now;lastTapId=id;
    if(pair){pairFrom=prev;pairUntil=now+BUF+.02;f.grabT=0}   // the 2nd finger doesn't catch again (the 1st one does)
    else{frozen=false;cmd={x,id,y};
      // tap-to-flip: the first tap picks the direction from its side; after that a tap that catches reverses it (a missed tap doesn't)
      if(flipMode()){if(!spinDir)spinDir=-Math.sign(x-W/2||1)*(save.opt.inv?-1:1);else{flipFrom=now;flipUntil=now+BUF+.02}}}
    if(nHeld()===2){releaseHand(1-lastGrabHand,false);syncBody();f.grabT=0}   /* both hands holding: a tap lets the older one go and the newest hand is the pivot (this tap doesn't catch again, so the let-go hand can't grab back the block it is still over) */
    f.hand=nHeld()===1?(hands[0].held?1:0):-1;return
  }
  // 1st: a hand that is already holding with no finger on it (e.g. the start grip) is taken over and steered
  const un=[0,1].find(i=>hands[i].held&&!claimedBy(i));
  if(un!==undefined){f.hand=un;hands[un].grace=0;return}
  if(nHeld()===0){f.hand=-1;return}                                 // in the air: whichever hand reaches a hold first
  // otherwise the new finger grabs with the opposite (free) hand
  const free=[0,1].find(i=>!hands[i].held&&!claimedBy(i));
  if(free!==undefined){f.hand=free;return}

  const f=fingers.get(id);if(!f)return;
  if(save.opt.mode==='one'){if(f.grabT>0)f.up=true;else fingers.delete(id);return}   // one-hand: lifting never lets go; a very short tap still gets its catch window
  fingers.delete(id);

function tutSteps(){const one=save.opt.mode==='one',flip=flipMode(),pc=isPC;
  if(!one&&pc)return[{id:'r',w:'X',t:'t_holdK'},{id:'ext',w:'↑',t:'t_slideK'},{id:'grab',w:'Z / X',t:'t_tap2K'}];
  if(!one)return[{id:'r',w:'HOLD',t:'t_hold'},{id:'ext',w:'SLIDE',t:'t_slide'},{id:'grab',w:'TAP',t:'t_tap2'}];
  if(flip&&pc)return[{id:'tap1',w:'CLICK',t:'t_tap1P'},{id:'grab',w:'CLICK',t:'t_catchP'},{id:'bar',w:'WHEEL',t:'t_barP'}];
  if(flip)return[{id:'tap1',w:'TAP',t:'t_tap1'},{id:'grab',w:'TAP',t:'t_catch'},{id:'bar',w:'SLIDE',t:'t_bar'}];
  return[{id:'r',w:'TAP',t:'t_tapR'},{id:'grab',w:'TAP',t:'t_catch'},{id:'bar',w:'SLIDE',t:'t_bar'}]}

  const st=tutSteps(),cur=st[tut.i];let ok=false;
  if(cur.id==='r'){if(steerU>DZ)tut.t+=dt;ok=tut.t>.7}
  else if(cur.id==='tap1'){if(spinDir)tut.t+=dt;ok=tut.t>.7}
  else if(cur.id==='grab2')ok=otherGrabs>tut.g0;
  else if(cur.id==='stop')ok=frozen||nHeld()===2;
  else if(cur.id==='bar'){if(tut.p0==null)tut.p0=armPct;ok=Math.abs(armPct-tut.p0)>=.3}
  else if(cur.id==='no'){tut.t+=dt;ok=tut.t>2.8}
  else if(cur.id==='spin')ok=feverOn();
  else if(cur.id==='fever'){tut.t+=dt;ok=tut.t>3.5}
  else if(cur.id==='get'){
    // one banana at a time, drifting over to the monkey so it can always be caught
    let bn=items.find(i=>i.k==='b');if(!bn){bn={k:'b',x:clamp(B.x+(Math.random()-.5)*2,.6,COLS-.6),y:B.y+2.4,v:.45,r:.3,g:false};items.push(bn)}
    bn.x=approach(bn.x,B.x,.8*dt);ok=runBan>tut.b0}
  else if(cur.id==='l'){if(steerU<-DZ)tut.t+=dt;ok=tut.t>.7}
  else if(cur.id==='ext')ok=L>=LMIN+.75*(Lmax-LMIN);
  else if(cur.id==='grab')ok=otherGrabs>tut.g0;
  else if(cur.id==='rel')ok=nHeld()===1;
  else if(cur.id==='flag')ok=B.y>=FLAGY;
  if(ok){tut.done=TUT_HOLD;tutEl.classList.add('ok');vib(30)}   // done: the step stays up a moment, ticked, before the next one
  // fell to the ground with nothing held: put the monkey back on the wall
  if(nHeld()===0&&B.y<1){if((tut.ground+=dt)>1.5){tut.ground=0;hands[0]=mkHand();hands[1]=mkHand();hands[0].held=true;hands[0].x=COLS/2+.5;hands[0].y=2.5;updPiv();L=.8*MK;phi=-Math.PI/2;w=wr=0;syncBody();B.vx=B.vy=0;fingers.clear();cmd=null}}

      const jb=[0,1].find(i=>f.just&&f.just[i]&&!hands[i].held&&(save.opt.mode==='one'||!claimedBy(i)));

/* ---------- render ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
/* blocks seen small (pulled-back camera): a block picture shrunk straight from its full size drops pixels unevenly and the wall
   turns blotchy (moire). So each picture is shrunk step by step (halving, smoothed) to the exact pixel size once and kept,
   and the blocks are put on whole pixels edge to edge, so every block and every seam looks the same. */

// a tone: frequency f (sliding to f2), length d seconds, waveform, volume, starting dl seconds from now
function tone(f,d,{type='sine',vol=.3,f2=0,dl=0,att=.004}={}){const a=AC,t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(AMaster);o.start(t);o.stop(t+d+.02)}
// filtered noise: a hiss, a thud or a whoosh depending on the filter
function noise(d,{vol=.3,ft='bandpass',f=1000,f2=0,q=1,dl=0,att=.004}={}){const a=AC,t=a.currentTime+dl,src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();src.buffer=ANoise;src.loop=true;
  fl.type=ft;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+d);
  src.connect(fl);fl.connect(g);g.connect(AMaster);src.start(t,Math.random()*.5);src.stop(t+d+.02)}

  for(const x of [...A0,...D0])if(x&&x.id&&!keep.has(x.id))d.doc('gh/'+LB.uid+'/r/'+x.id).delete().catch(()=>{});
  return true}catch(e){return false}}
async function lbRename(){const d=LB.db;if(!d)return;try{const ref=d.doc('lb/'+LB.uid),s=await ref.get();if(s.exists)await ref.update({n:save.name})}catch(e){}}
// the ranking: one row per player, their best run (BOOST and SKILL alike). Your place below the top 100 = 1 + players with a higher best
async function lbFetch(m,k){const day=utcDay(),loc=runsOf(m,k);let best=loc.length?loc[0].h:null,rows=[],online=false,rank=null;
  if(LB.db){const P=lbKey(m),col=LB.db.collection('lb'),hk=k==='A'?P+'A':P+'Dh',lk=P+(k==='A'?'Al':'Dl');
    const base=()=>k==='A'?col:col.where(P+'D','==',day);
    const snap=await base().orderBy(hk,'desc').limit(LB_N).get();
    for(const d of snap.docs){const x=d.data(),l=Array.isArray(x[lk])?x[lk]:[],n=String(x.n||'?').slice(0,16),e=l[0];
      if(!e||typeof e.h!=='number'||!e.id)continue;if(d.id===LB.uid&&(best==null||e.h>best))best=e.h;
      rows.push({uid:d.id,id:String(e.id),n,h:e.h,me:d.id===LB.uid})}
    rows.sort((a,b)=>b.h-a.h||(a.id<b.id?-1:1));if(rows.length>LB_N)rows.length=LB_N;
    const i=rows.findIndex(r=>r.me);
    if(i>=0)rank=i+1;
    else if(best!=null&&rows.length<LB_N)rank=1+rows.filter(r=>r.h>best).length;
    else if(best!=null){const seen=new Set();let above=0,top=Infinity;   // read 1000 at a time from the top down
      for(let page=0;page<50;page++){let q=base().where(hk,'>',best);if(top<Infinity)q=q.where(hk,'<=',top);
        const ps=await q.orderBy(hk,'desc').limit(1000).get();let fresh=0;
        for(const d of ps.docs){if(seen.has(d.id))continue;seen.add(d.id);fresh++;above++;top=Math.min(top,d.data()[hk])}
        if(ps.docs.length<1000||!fresh)break}
      rank=Math.max(LB_N+1,above+1)}
    online=true}
  else if(loc.length){rows=[{uid:'me',id:loc[0].id,n:save.name,h:loc[0].h,me:true}];rank=1}
  return {rows,rank:rank==null?null:rank.toLocaleString('en-US'),mine:best,online}}
async function lbGhost(uid,id){
  if(uid==='me'||uid===LB.uid){const g=lsGet('tsumi_gr_'+id);if(g)return g}
  if(!LB.db||uid==='me')return null;const s=await LB.db.doc('gh/'+uid+'/r/'+id).get();return s.exists?s.data():null}

pruneLocal();
// ranking panel: DAILY / ALL TIME, BOOST / SKILL, top 100 with a race button each, and your own place pinned at the bottom.
// The same block is used twice: the RANK window on the home screen and the page to the right of the results
function makeLB(root){const q=c=>root.querySelector(c),list=q('.lb-list'),you=q('.lb-you'),reset=q('.lb-reset'),st={m:'s',k:'D',tok:0};   // the ranking is SKILL's only (BOOST has none)
  const tick=()=>{if(st.k!=='D'){reset.textContent=' ';return}const n=new Date(),nx=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1),t=Math.max(0,(nx-n)/1000|0);
    const p=v=>String(v).padStart(2,'0');reset.textContent='RESETS IN '+p(t/3600|0)+'H '+p((t%3600)/60|0)+'M '+p(t%60)+'S'};
  async function render(){for(const b of root.querySelectorAll('.lb-tabs button'))b.classList.toggle('sel',b.dataset.k===st.k);
    for(const b of root.querySelectorAll('.lb-modes button'))b.classList.toggle('sel',b.dataset.m===st.m);
    tick();const tok=++st.tok;if(st.key!==st.m+st.k||!list.querySelector('.lb-row')){list.innerHTML='<div class="lb-msg">…</div>';you.innerHTML=''}st.key=st.m+st.k;
    let r=null,err=null;try{r=await lbFetch(st.m,st.k)}catch(e){err=e}
    if(tok!==st.tok)return;
    if(!r){list.innerHTML='<div class="lb-msg">—'+(err?'<small style="display:block;font-size:11px;opacity:.75;margin-top:6px">'+esc(String(err.code||err.message||err).slice(0,80))+'</small>':'')+'</div>';return}   // the reason, so a failing ranking can be traced
    list.innerHTML=r.rows.length?r.rows.map((x,i)=>`<div class="lb-row${x.me?' me':''}"><span class="lb-rk${i<3?' r'+(i+1):''}">${i+1}</span><span class="lb-n">${esc(x.n)}</span><span class="lb-h">${fmtH(x.h)}m</span><button class="lb-go" data-uid="${esc(x.uid)}" data-id="${esc(x.id)}" aria-label="Race">${IC.play}</button></div>`).join(''):'<div class="lb-msg">—</div>';
    you.innerHTML=`<span class="lb-rk you">${r.rank??'—'}</span><span class="lb-n">${esc(save.name)}</span><span class="lb-h">${r.mine!=null?fmtH(r.mine)+'m':'—'}</span>`+(r.online?'':'<span class="lb-off">LOCAL</span>')}
  for(const b of root.querySelectorAll('.lb-tabs button'))b.onclick=()=>{st.k=b.dataset.k;render()};
  for(const b of root.querySelectorAll('.lb-modes button'))b.onclick=()=>{st.m=b.dataset.m;render()};
  list.addEventListener('click',async e=>{const b=e.target.closest('.lb-go');if(!b||b.disabled)return;b.disabled=true;
    let g=null;try{g=await lbGhost(b.dataset.uid,b.dataset.id)}catch(_){}
    if(!g||g.v!==GHOST_VER||!g.f){b.classList.add('nogo');return}
    const gd=decodeGhost(g.f),gh={n:gd.n,f:gd.f,name:String(g.name||'?').slice(0,16),av:g.av,h:g.h,m:g.m==='s'?'s':'b'};
    closeRanking();if(trans)return;
    transition(()=>{newRun(false,0,g.seed>>>0,gh);menu.hidden=true;hudEl.hidden=false;showPage(0)},()=>{running=true})});
  return {st,render,tick,root}}
const lbModal=document.getElementById('lbModal'),lbM=makeLB(lbModal),rankPage=document.getElementById('rankPage'),lbP=makeLB(rankPage);
setInterval(()=>{if(!lbModal.hidden)lbM.tick();if(page===1&&!menu.hidden)lbP.tick()},1000);
document.getElementById('lbClose').innerHTML=IC.close;
function openRanking(){lbM.st.m='s';
  // measure the UPGRADE panel (as it would open now) and give the ranking the same height; both sit centred, so they match exactly
  buildMenu();upModal.style.visibility='hidden';upModal.hidden=false;const ur=upModal.firstElementChild.getBoundingClientRect();upModal.hidden=true;upModal.style.visibility='';
  const lp=lbModal.firstElementChild;lp.style.height=ur.height+'px';lp.style.position='relative';lp.style.top='0px';lbModal.hidden=false;
  lp.style.top=(ur.top-lp.getBoundingClientRect().top)+'px';lbM.render()}
function closeRanking(){lbModal.hidden=true}
document.getElementById('lbClose').onclick=closeRanking;
lbModal.addEventListener('pointerdown',e=>{if(e.target===lbModal)closeRanking()});

// results screen pages: 0 = the results, 1 = the ranking (swipe left / right; the dots at the bottom show which)
let page=0;const pgDots=document.getElementById('pgDots');
const PEEK=34;menu.style.setProperty('--peek',PEEK+'px');   // px of the ranking showing at the right edge of the results
let pageL=16,uiBusy=false,busyT=0;   // pageL: the ranking panel's left edge (measured when the layout changes, not while moving)
const measurePage=()=>{pageL=rankPage.firstElementChild.offsetLeft};
function setPagesOn(on){rankPage.hidden=pgDots.hidden=!on;menu.classList.toggle('paged',on);if(!on){wideMove(false);menu.classList.remove('wide');placeRank()}if(!on)showPage(0);else{measurePage();pageX(page);if(rankPage._was!==on){lbP.st.m='s';lbP.render()}}rankPage._was=on}   // filled at once, so the peeking edge shows the list
// a wide screen (a PC): no pages — the result on the left and the ranking on the right, side by side, both in full view
const WIDE=()=>innerWidth>=900&&innerWidth>innerHeight*1.1;
const rkSlot=document.getElementById('rkSlot');
// wide: the ranking panel is laid exactly over its slot in the card (right of the result)
function placeRank(){const pn=rankPage.firstElementChild;if(!menu.classList.contains('wide')||rankPage.hidden){pn.style.cssText='';return}
  const r=rkSlot.getBoundingClientRect();rankPage.style.transform='none';cardEl.style.transform='';
  pn.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;max-width:none;margin:0`}
// wide: UPGRADE and REVIVE move up under the result (left column); back into the button row otherwise
const wideSub=document.getElementById('wideSub'),upBtnW=document.getElementById('upBtn'),revW=document.getElementById('revive');
function wideMove(on){const mv=document.getElementById('mainView');if(on){if(upBtnW.parentNode!==wideSub){wideSub.appendChild(upBtnW);wideSub.appendChild(revW)}}
  else if(upBtnW.parentNode!==mv){mv.insertBefore(revW,mv.firstChild);mv.insertBefore(upBtnW,revW)}}
function pageX(p,dx=0){if(WIDE()&&!rankPage.hidden){   // (only with the ranking up: after a SKILL run; BOOST keeps the plain layout)
  wideMove(true);menu.classList.add('wide');rankPage.classList.remove('peek');pgDots.hidden=true;requestAnimationFrame(placeRank);return}
  wideMove(false);menu.classList.remove('wide');placeRank();if(!rankPage.hidden)pgDots.hidden=false;
  const w=innerWidth,base=p?0:Math.max(0,w-PEEK-pageL);
  cardEl.style.transform=p||dx?`translate3d(${-p*w+dx}px,0,0)`:'';rankPage.style.transform=`translate3d(${base+dx}px,0,0)`;rankPage.classList.toggle('peek',!p)}
// while the pages move, the game picture behind is left as it is (no redraw), so the slide stays smooth
function busy(ms){uiBusy=true;clearTimeout(busyT);busyT=setTimeout(()=>uiBusy=false,ms)}
function showPage(p){const was=page;page=p;cardEl.style.transition=rankPage.style.transition='';pageX(p);if(p!==was)busy(380);
  pgDots.children[0].classList.toggle('on',p===0);pgDots.children[1].classList.toggle('on',p===1);
  if(p===1&&was!==1){lbP.st.m='s';lbP.render()}}
{let sw=null,moved=false,raf=0;
  menu.addEventListener('pointerdown',e=>{if(rankPage.hidden||trans||WIDE())return;sw={id:e.pointerId,x:e.clientX,y:e.clientY,on:false,dx:0}});
  menu.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(!sw.on){if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.2)return;sw.on=true;uiBusy=true;clearTimeout(busyT);cardEl.style.transition=rankPage.style.transition='none'}
    sw.dx=page===0?Math.min(0,dx):Math.max(0,dx);   // one position per screen frame
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(sw&&sw.on)pageX(page,sw.dx)})});
  const end=e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,on=sw.on;sw=null;if(!on)return;moved=true;
    const np=page===0&&dx<-50?1:page===1&&dx>50?0:page;showPage(np);busy(380)};
  menu.addEventListener('pointerup',end);menu.addEventListener('pointercancel',e=>{if(sw&&sw.on){sw=null;showPage(page);busy(380)}else sw=null});
  menu.addEventListener('click',e=>{if(moved){moved=false;e.stopPropagation();e.preventDefault()}},true);   // a swipe is not a tap
  addEventListener('resize',()=>{if(!rankPage.hidden){measurePage();pageX(page)}});menu.addEventListener('scroll',()=>{if(menu.classList.contains('wide'))placeRank()})}
pgDots.children[0].classList.add('on');

// player name: from the top left of the home screen
const nameModal=document.getElementById('nameModal'),nmInput=document.getElementById('nmInput'),nameBtn=document.getElementById('nameBtn');
document.getElementById('nmClose').innerHTML=IC.close;
function paintName(){nameBtn.innerHTML=IC.pen+'<span>'+esc(save.name)+'</span>'}
nameBtn.onclick=()=>{nmInput.value=save.name;nameModal.hidden=false;setTimeout(()=>{nmInput.focus();nmInput.select()},30)};
function closeName(){nameModal.hidden=true}
document.getElementById('nmClose').onclick=closeName;
nameModal.addEventListener('pointerdown',e=>{if(e.target===nameModal)closeName()});
function saveName(){const v=nmInput.value.replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,12);if(v){save.name=v;persist();paintName();lbRename()}closeName()}
document.getElementById('nmOk').onclick=saveName;
nmInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveName()}});
paintName();

// BOOST / SKILL switch on the home screen
function paintModes(){for(const b of document.querySelectorAll('#gmodes button'))b.classList.toggle('sel',b.dataset.g===save.gmode)}
for(const b of document.querySelectorAll('#gmodes button'))b.onclick=()=>{save.gmode=b.dataset.g;runMode=save.gmode;persist();paintModes();showView('main');buildMenu()};
paintModes();

newRun();buildMenu();applyLang();showView('main');requestAnimationFrame(frame);
})();
